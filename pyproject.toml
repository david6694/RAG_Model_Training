[project]
name = "RAG_Model_training"
version = "0.1.0"
description = "High performance RAG system for vLLM corpus - 42 School"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "fire>=0.6.0",
    "tqdm>=4.66.0",
    "rank-bm25>=0.2.2",
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "huggingface-hub>=0.22.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = [".venv", "data", "build", "dist"]
files = ["src"]

[dependency-groups]
dev = [
    "pypdf>=6.16.1",
]
